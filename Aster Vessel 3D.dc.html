<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
      "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
      "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js",
      "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js"
    },
    "integrity": {
      "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
      "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
      "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
      "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
      "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
    }
  }
  </script>
  <script src="./three-d-stage.js"></script>
  <style>
    three-d-stage:not(:defined) { visibility: hidden; }
    body { margin: 0; background: #FFFFFF; font-family: Gantari, sans-serif; }
    .aster3d-wrap { position: relative; width: 100%; height: 100vh; }
    .aster3d-label {
      position: absolute; left: 32px; top: 32px; z-index: 5;
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
      font-size: 26px; color: #1C1C1C; pointer-events: none;
    }
    .aster3d-sub {
      position: absolute; left: 32px; top: 66px; z-index: 5;
      font-family: Gantari, sans-serif; font-size: 11px; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(28,28,28,0.5); pointer-events: none;
    }
  </style>
</helmet>
<div class="aster3d-wrap">
  <span class="aster3d-label">The Aster Vessel</span>
  <span class="aster3d-sub">Drag to orbit &middot; scroll to zoom</span>
  <three-d-stage name="the-aster-vessel" background="#FFFFFF" autorotate></three-d-stage>
</div>
<script type="module">
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  const stage = document.querySelector('three-d-stage');
  const { THREE } = await stage.ready;
  const loader = new GLTFLoader();
  loader.load('./assets/aster/aster-vessel.glb', (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 0.42 / maxDim;
    model.scale.setScalar(scale);
    const center = new THREE.Vector3();
    box.getCenter(center);
    model.position.sub(center.multiplyScalar(scale));
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;
    stage.setObject(model);
  }, undefined, (err) => {
    console.error('Failed to load Aster Vessel model', err);
  });
</script>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:700}}"></script>
</body>
</html>
